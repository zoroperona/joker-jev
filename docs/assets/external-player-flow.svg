<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Screenshot-only Dou Dizhu decision and execution loop</title><desc id="desc">Capture the browser, recognize visible cards and events, track public state, choose a play with DouZero, verify UI targets, click, and confirm the resulting play from a new screenshot. Uncertain observations or unconfirmed actions stop execution.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#78988c" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="420" rx="20" fill="#f4f1e9"/>
<g font-family="Arial, sans-serif"><text x="36" y="44" fill="#244d40" font-size="13" letter-spacing="3">JOKER + JEV / EXTERNAL PLAYER</text><text x="36" y="80" fill="#203b32" font-size="27" font-weight="700">Observe. Decide. Act. Confirm.</text>
<text x="36" y="109" fill="#64766c" font-size="14">The policy sees public state. The executor sees pixels. The next frame confirms what happened.</text>
<rect x="36" y="147" width="184" height="154" rx="12" fill="#fffdf7" stroke="#b6c6b9"/>
<text x="52" y="174" fill="#657a6f" font-size="11" letter-spacing="1.1">01 / CAPTURE</text>
<text x="52" y="207" fill="#203b32" font-size="16" font-weight="700">Browser screenshot</text>
<text x="52" y="241" fill="#657a6f" font-size="12">Visible pixels only</text>
<text x="52" y="261" fill="#657a6f" font-size="12">1440 × 1600 · 2×</text>
<path d="M223,223 H236" fill="none" stroke="#78988c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="147" width="184" height="154" rx="12" fill="#fffdf7" stroke="#b6c6b9"/>
<text x="256" y="174" fill="#657a6f" font-size="11" letter-spacing="1.1">02 / READ</text>
<text x="256" y="207" fill="#203b32" font-size="16" font-weight="700">Visual recognition</text>
<text x="256" y="241" fill="#657a6f" font-size="12">Hand ranks: vision</text>
<text x="256" y="261" fill="#657a6f" font-size="12">Layout &amp; history: OCR</text>
<path d="M427,223 H440" fill="none" stroke="#78988c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="444" y="147" width="184" height="154" rx="12" fill="#fffdf7" stroke="#b6c6b9"/>
<text x="460" y="174" fill="#657a6f" font-size="11" letter-spacing="1.1">03 / TRACK</text>
<text x="460" y="207" fill="#203b32" font-size="16" font-weight="700">Public state</text>
<text x="460" y="241" fill="#657a6f" font-size="12">Own hand · events</text>
<text x="460" y="261" fill="#657a6f" font-size="12">Counts · turn · legal moves</text>
<path d="M631,223 H644" fill="none" stroke="#78988c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="648" y="147" width="184" height="154" rx="12" fill="#204f41" stroke="#b6c6b9"/>
<text x="664" y="174" fill="#c8d9cf" font-size="11" letter-spacing="1.1">04 / DECIDE</text>
<text x="664" y="207" fill="#fffdf7" font-size="16" font-weight="700">DouZero ADP</text>
<text x="664" y="241" fill="#c8d9cf" font-size="12">Frozen role weights</text>
<text x="664" y="261" fill="#c8d9cf" font-size="12">Choose a legal play</text>
<path d="M835,223 H848" fill="none" stroke="#78988c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="852" y="147" width="184" height="154" rx="12" fill="#fffdf7" stroke="#b6c6b9"/>
<text x="868" y="174" fill="#657a6f" font-size="11" letter-spacing="1.1">05 / VERIFY</text>
<text x="868" y="207" fill="#203b32" font-size="16" font-weight="700">UI grounding</text>
<text x="868" y="241" fill="#657a6f" font-size="12">Turn · labels · card ranks</text>
<text x="868" y="261" fill="#657a6f" font-size="12">Button style · fresh frame</text>
<path d="M1039,223 H1052" fill="none" stroke="#78988c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1056" y="147" width="184" height="154" rx="12" fill="#fffdf7" stroke="#b6c6b9"/>
<text x="1072" y="174" fill="#657a6f" font-size="11" letter-spacing="1.1">06 / EXECUTE</text>
<text x="1072" y="207" fill="#203b32" font-size="16" font-weight="700">Mouse actions</text>
<text x="1072" y="241" fill="#657a6f" font-size="12">Select cards · submit</text>
<text x="1072" y="261" fill="#657a6f" font-size="12">Confirm in next frame</text>
<path d="M1148,306 V343 H128 V307" fill="none" stroke="#78988c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="418" y="328" width="442" height="27" rx="12" fill="#f4f1e9"/><text x="640" y="347" text-anchor="middle" fill="#315d4c" font-size="13">New screenshot → confirm event → update public state</text>
<text x="36" y="389" fill="#657a6f" font-size="12">No game API / DOM / hidden-hand reads</text><text x="1244" y="389" text-anchor="end" fill="#657a6f" font-size="12">Uncertain or inconsistent evidence → stop, no blind retry</text></g></svg>
