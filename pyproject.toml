[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "joker-jev"
version = "0.1.0"
description = "可扩展的卡牌游戏环境与 JEV 决策接口"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
joker-jev = "joker_jev.__main__:main"

[tool.setuptools.packages.find]
include = ["joker_jev*"]

[project.optional-dependencies]
external = ["playwright==1.58.0", "Pillow==11.3.0", "torch==2.6.0", "numpy==2.2.6", "douzero==1.1.0"]

[tool.setuptools.package-data]
"joker_jev.external" = ["vision.swift"]
