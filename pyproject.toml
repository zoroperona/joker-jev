[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "joker-jev"
version = "0.1.0"
description = "Screenshot-driven Dou Dizhu player with DouZero strategy and Jev-compatible UI recognition"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
joker-jev = "joker_jev.__main__:main"

[tool.setuptools.packages.find]
include = ["joker_jev*"]

[project.optional-dependencies]
external = ["playwright==1.58.0", "Pillow==11.3.0", "torch==2.6.0", "numpy==2.2.6", "douzero==1.1.0"]

[tool.setuptools.package-data]
"joker_jev.external" = ["vision.swift"]
